<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Perfekt – Der Zeitdetektiv</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#162c40;background:#eef3f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:18px}header{background:#163c60;color:white;padding:22px;border-radius:17px}h1{margin:0;font-size:clamp(1.6rem,4vw,2.5rem)}h2{margin:0 0 12px}.muted{opacity:.8}.panel{background:white;border-radius:16px;padding:23px;margin-top:18px;box-shadow:0 5px 18px #18314a13}.bar{height:12px;background:#dce7ee;border-radius:30px;overflow:hidden;margin-top:13px}.fill{height:100%;background:#43a58c;width:0;transition:width .25s}.pill{display:inline-block;background:#e6f0f7;padding:6px 11px;border-radius:30px;margin:4px 5px 4px 0;font-size:.9rem}button{border:2px solid #c7d8e3;background:#f6f9fb;border-radius:10px;padding:11px 14px;font-size:1rem;cursor:pointer;color:#14314a}button:hover{border-color:#2675a8}button:focus-visible{outline:3px solid orange}button.primary{background:#176d94;color:white;border-color:#176d94}button:disabled{opacity:.48;cursor:default}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.options button{text-align:left}.options button.selected{border-color:#146da3;background:#d9edf9}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tokens button{background:#e9f2fc}.sentence{min-height:65px;padding:12px;border:2px dashed #9db8cb;border-radius:10px;background:#fafcfd;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.sentence button{background:#d7eaf7}.feedback{border-radius:10px;padding:13px;margin:12px 0;background:#e6f5ed;border-left:5px solid #319a6d}.feedback.bad{background:#fff0e8;border-left-color:#d57c36}.small{font-size:.92rem;color:#42576b}.hidden{display:none}.topline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}footer{font-size:.82rem;text-align:center;margin:20px 0;color:#567}</style></head><body><div class="wrap"><header><h1>🕵️ Mission Perfekt</h1><div>Der Zeitdetektiv · 3e · Zu weit weg</div><div class="bar"><div class="fill" id="progress"></div></div><div class="topline"><span id="stage">Prêt à jouer ?</span><span id="score">Score : 0 / 0</span></div></header><main class="panel" id="app"></main><footer>Sans compte · Sans chronomètre · Fonctionne hors connexion</footer></div><script>
const stages=[
{name:'Partizip-Detektive',intro:'Classe les participes II. Attention : ici, les verbes modaux constituent un groupe à part.',kind:'mc',items:[
['gemacht','Verbe faible','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gefahren','Verbe fort','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gedacht','Verbe mixte','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gekonnt','Verbe modal','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gezeigt','Verbe faible','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gefunden','Verbe fort','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gebracht','Verbe mixte','Verbe faible','Verbe fort','Verbe mixte','Verbe modal'],['gemusst','Verbe modal','Verbe faible','Verbe fort','Verbe mixte','Verbe modal']]},
{name:'Haben oder sein?',intro:'Choisis l’auxiliaire du Perfekt pour chaque phrase.',kind:'mc',items:[
['Ben ___ Geburtstag gefeiert.','hat','hat','ist'],['Ben und Tariq ___ Fahrrad gefahren.','sind','haben','sind'],['Tariq ___ bei Ben übernachtet.','hat','hat','ist'],['Tariq ___ nach Hause gekommen.','ist','hat','ist'],['Ben ___ einen Film gesehen.','hat','hat','ist'],['Die Freunde ___ Blutsbrüder geworden.','sind','haben','sind'],['Ben ___ das Video gezeigt.','hat','hat','ist'],['Tariq ___ seinen Bruder wiedergefunden.','hat','hat','ist']]},
{name:'Satz-Puzzle',intro:'Clique sur les éléments dans le bon ordre pour construire la phrase au Perfekt.',kind:'order',items:[
['Ben hat seinen Geburtstag gefeiert.',['Ben','hat','seinen Geburtstag','gefeiert.']],['Tariq ist nach Hause gekommen.',['Tariq','ist','nach Hause','gekommen.']],['Ben und Tariq sind Fahrrad gefahren.',['Ben und Tariq','sind','Fahrrad','gefahren.']],['Ben hat Tariq sein Dorf gezeigt.',['Ben','hat','Tariq','sein Dorf','gezeigt.']],['Tariq hat bei Ben übernachtet.',['Tariq','hat','bei Ben','übernachtet.']],['Die Freunde sind Blutsbrüder geworden.',['Die Freunde','sind','Blutsbrüder','geworden.']]]},
{name:'Film-Challenge',intro:'Retrouve la bonne transformation au Perfekt.',kind:'mc',items:[
['Tariq findet seinen Bruder wieder.','Tariq hat seinen Bruder wiedergefunden.','Tariq hat seinen Bruder wiedergefunden.','Tariq ist seinen Bruder wiedergefunden.','Tariq hat seinen Bruder gefunden wieder.'],['Ben schafft Tariqs Move.','Ben hat Tariqs Move geschafft.','Ben ist Tariqs Move geschafft.','Ben hat Tariqs Move geschafft.','Ben hat Tariqs Move geschafften.'],['Sie besichtigen Bens Haus.','Sie haben Bens Haus besichtigt.','Sie sind Bens Haus besichtigt.','Sie haben Bens Haus gebesichtigt.','Sie haben Bens Haus besichtigt.'],['Tariq zeigt Ben einen Move.','Tariq hat Ben einen Move gezeigt.','Tariq hat Ben einen Move gezeigt.','Tariq ist Ben einen Move gezeigt.','Tariq hat gezeigt Ben einen Move.'],['Ben und Tariq werden Blutsbrüder.','Ben und Tariq sind Blutsbrüder geworden.','Ben und Tariq haben Blutsbrüder geworden.','Ben und Tariq sind Blutsbrüder geworden.','Ben und Tariq sind Blutsbrüder gewerden.'],['Ben zeigt seinem Bruder das Video.','Ben hat seinem Bruder das Video gezeigt.','Ben ist seinem Bruder das Video gezeigt.','Ben hat seinem Bruder das Video gezeigt.','Ben hat gezeigt seinem Bruder das Video.']]},
{name:'Das große Finale',intro:'Mélange de toutes les règles : participe, préfixes et auxiliaire.',kind:'mc',items:[
['Quel est le participe II de « besuchen » ?','besucht','gebesucht','besuchen','besucht'],['Quel est le participe II de « wiederfinden » ?','wiedergefunden','gewiederfunden','wiedergefunden','wiedergefindet'],['Quel est le participe II de « übernachten » ?','übernachtet','geübernachtet','übergenachtet','übernachtet'],['Complète : « Ich ___ nach Berlin gefahren. »','bin','habe','bin','hat'],['Quel est le participe II de « denken » ?','gedacht','gedenkt','gedacht','gedenken'],['Complète : « Wir ___ Fußball gespielt. »','haben','sind','haben','hat'],['Quel est le participe II de « schreiben » ?','geschrieben','geschreibt','geschrieben','schreibenge'],['Où se trouve normalement le participe II dans une phrase déclarative ?','À la fin','Juste après le sujet','À la fin','Avant l’auxiliaire']]}
];
let si=0,qi=0,points=0,total=stages.reduce((n,s)=>n+s.items.length,0),answered=false,choice=null,assembled=[],pool=[];
const $=id=>document.getElementById(id),app=$('app');function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function update(){let done=stages.slice(0,si).reduce((n,s)=>n+s.items.length,0)+qi;$('progress').style.width=(100*done/total)+'%';$('stage').textContent=si<stages.length?`Mission ${si+1}/5 · Question ${qi+1}/${stages[si].items.length}`:'Mission terminée';$('score').textContent=`Score : ${points} / ${done}`}
function start(){si=0;qi=0;points=0;render()};function render(){update();if(si>=stages.length){$('progress').style.width='100%';app.innerHTML=`<h2>🎉 Mission accomplie !</h2><p>Tu as obtenu <strong>${points} / ${total}</strong> points.</p><p>${points>=total*.8?'Excellent ! Tu maîtrises déjà beaucoup de règles.':'Bien joué ! Relis les explications des questions difficiles et réessaie.'}</p><button class="primary" onclick="start()">Recommencer la mission</button>`;return}let s=stages[si],it=s.items[qi];answered=false;choice=null;assembled=[];app.innerHTML=`<div class="small">${esc(s.name)}</div><h2>${si+1}. ${esc(s.name)}</h2><p>${esc(s.intro)}</p><div class="pill">Question ${qi+1} sur ${s.items.length}</div><h3>${s.kind==='order'?'Remets les mots dans l’ordre :':esc(it[0])}</h3><div id="work"></div><div id="feedback"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="check" class="primary" disabled onclick="check()">Vérifier</button><button id="next" class="primary hidden" onclick="next()">${qi===s.items.length-1?(si===stages.length-1?'Voir mon résultat':'Mission suivante'):'Question suivante'} →</button></div>`;if(s.kind==='mc'){let opts=it.slice(2);$('work').innerHTML='<div class="options">'+opts.map((x,i)=>`<button onclick="pick(${i})" id="opt${i}">${esc(x)}</button>`).join('')+'</div>'}else{pool=it[1].map((t,i)=>({t,i}));pool.sort((a,b)=>((a.i*7+3)%11)-((b.i*7+3)%11));if(pool.every((x,i)=>x.i===i))pool.reverse();drawOrder()}}
function pick(i){if(answered)return;choice=i;document.querySelectorAll('.options button').forEach((b,j)=>b.classList.toggle('selected',j===i));$('check').disabled=false}function drawOrder(){let remaining=pool.filter(x=>!assembled.some(y=>y.i===x.i));$('work').innerHTML=`<div class="small">Ta phrase (clique sur un élément pour le retirer) :</div><div class="sentence">${assembled.map(x=>`<button onclick="removeToken(${x.i})">${esc(x.t)}</button>`).join('')||'<span class="small">Choisis un premier élément…</span>'}</div><div class="small">Éléments disponibles :</div><div class="tokens">${remaining.map(x=>`<button onclick="addToken(${x.i})">${esc(x.t)}</button>`).join('')}</div>`;$('check').disabled=assembled.length!==pool.length}function addToken(i){if(answered)return;assembled.push(pool.find(x=>x.i===i));drawOrder()}function removeToken(i){if(answered)return;assembled=assembled.filter(x=>x.i!==i);drawOrder()}
function hint(s,it){if(s.kind==='order')return 'Dans une phrase déclarative : sujet + auxiliaire conjugué + compléments + participe II à la fin.';if(si===0)return 'Observe la terminaison et les changements de radical. Les modaux forment ici une catégorie spéciale.';if(si===1)return 'On utilise souvent sein avec un déplacement ou un changement d’état ; sinon, souvent haben.';if(si===3)return 'Vérifie l’auxiliaire, la place du participe et les préfixes.';return 'Pour les préfixes inséparables (be-, ver-, er-, ent-, emp-, zer-), on ne met pas ge- devant.'}
function check(){if(answered)return;let s=stages[si],it=s.items[qi],good=s.kind==='mc'?it[choice+2]===it[1]:assembled.map(x=>x.i).join(',')===it[1].map((_,i)=>i).join(',');answered=true;if(good)points++;let correct=s.kind==='order'?it[0]:it[1];$('feedback').innerHTML=`<div class="feedback ${good?'':'bad'}"><strong>${good?'✓ Bonne réponse !':'✗ Pas encore.'}</strong>${good?'':`<div>Réponse attendue : <strong>${esc(correct)}</strong></div>`}<div class="small">${esc(hint(s,it))}</div></div>`;$('check').classList.add('hidden');$('next').classList.remove('hidden');document.querySelectorAll('#work button').forEach(b=>b.disabled=true);$('score').textContent=`Score : ${points} / ${stages.slice(0,si).reduce((n,x)=>n+x.items.length,0)+qi+1}`}
function next(){qi++;if(qi>=stages[si].items.length){si++;qi=0}render()}
app.innerHTML=`<h2>Bienvenue, détective !</h2><p>Le film <em>Zu weit weg</em> a perdu sa chronologie. À toi de maîtriser le <strong>Perfekt</strong> pour reconstituer les événements.</p><p><span class="pill">5 missions</span><span class="pill">${total} défis</span><span class="pill">Sans chronomètre</span><span class="pill">Correction immédiate</span></p><p>Lis les indices après chaque question. Tu peux recommencer autant de fois que tu veux.</p><button class="primary" onclick="start()">Commencer →</button>`;
</script></body></html>
